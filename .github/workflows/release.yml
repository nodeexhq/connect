name: release

# Pushing a tag such as v0.2.0 builds Connect for every system, signs and
# notarizes the macOS builds and the NodeEx Connect app, publishes them as a
# release, and points the app's update feed at the new version.
#
# The signing material is in the organization's secrets:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the Developer ID certificate
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  for Apple's notary service
#   SPARKLE_PRIVATE_KEY                          signs the app's updates
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The app's build number is the count of commits.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: swift test --package-path app

      - name: Signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: echo "SIGN_IDENTITY=$(scripts/ci-signing.sh)" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          # The measuring program Connect copies into a rented machine.
          scripts/build-guest.sh
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}
            name=$os; [ "$os" = darwin ] && name=macos
            cpu=$arch; [ "$arch" = amd64 ] && cpu=x64
            exe=nodeex-connect; [ "$os" = windows ] && exe=nodeex-connect.exe
            dir=dist/nodeex-connect
            rm -rf "$dir" && mkdir "$dir"
            GOOS=$os GOARCH=$arch go build -tags guestbin -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$dir/$exe" ./cmd/nodeex-connect
            [ "$os" != darwin ] || scripts/sign-binary.sh "$dir/$exe"
            cp LICENSE README.md "$dir/"
            base="nodeex-connect_${TAG}_${name}_${cpu}"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$base.zip" nodeex-connect); else tar -C dist -czf "dist/$base.tar.gz" nodeex-connect; fi
          done
          rm -rf dist/nodeex-connect
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: The app
        run: VERSION="$TAG" app/scripts/package.sh

      - name: Publish
        run: |
          gh release create "$TAG" dist/* --prerelease --title "NodeEx Connect $TAG" \
            --notes "NodeEx Connect for macOS (the app, for Apple silicon and Intel) and the command-line client for macOS, Windows and Linux. The macOS builds are signed with a Developer ID and notarized by Apple. Windows and Linux builds are unsigned, and the Windows builds are untested on real hardware. Verify downloads against the checksums."

      - name: The app, for a test build
        if: ${{ contains(github.ref_name, '-') }}
        run: gh release upload "$TAG" app/dist/NodeEx-Connect-"$TAG".dmg --clobber

      - name: Update feed
        # A test build (a tag with a suffix, such as v0.1.16-test.1) is published
        # for trying on one machine; installed apps are not offered it.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key" app/scripts/publish.sh "$TAG"
          rm -f "$RUNNER_TEMP/sparkle.key"
          # Installed apps read the feed from the main branch.
          cp app/appcast.xml "$RUNNER_TEMP/appcast.xml"
          git fetch -q origin main
          git checkout -q -f -B main origin/main
          cp "$RUNNER_TEMP/appcast.xml" app/appcast.xml
          git config user.name "NodeEx"
          git config user.email "hello@nodeex.com"
          git add app/appcast.xml
          git commit -q -m "Update feed: $TAG"
          git push -q origin main
